# For more infomation, please visit: https://github.com/github/codeql-action

name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: false
        fetch-depth: 2

    - name: Record analyzed revision
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        git rev-parse HEAD
        if [ -n "$PR_HEAD_SHA" ]; then
          git merge-base --is-ancestor "$PR_HEAD_SHA" HEAD
        fi
        test -f tests/bazel/wheel_incremental.py
        test -f tests/bazel/test_wheel_incremental.py

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        config-file: ./.github/codeql/codeql-config.yml
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
